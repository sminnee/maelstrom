# `_main` is maelstrom's fixed environment — see docs/guide/worktrees.md.
main_port_base: 277
install_cmd: bin/install

# The Changes tab's Diff groups. See docs/reference/configuration.md.
diff_groups:
  - name: Goldens and fixtures
    paths: ["**/fixtures/**"]
    collapsed: true
  - name: Lockfiles
    paths: [uv.lock, pnpm-lock.yaml]
    collapsed: true
  - name: Tests
    paths: ["**/tests/**", "test_*.py", "*.test.ts", "*.test.tsx", "**/src/test/**", "**/src/fake/**"]
  - name: Docs
    paths: ["docs/**", "*.md"]
  - name: Web
    paths: ["orchestrator-ui/**", "vite-plugin-mael-jig/**"]
  - name: Python
    paths: ["*.py", "pyproject.toml"]

linear:
  team_id: 3201e7ca-cceb-4079-b8ef-51ffbde14db7
  product_label: Maelstrom

services:
  web:
    ports: [FRONTEND, FRONTEND_HMR]
    dir: orchestrator-ui
    command: pnpm dev
    env:
      # The dev server's `/api` proxy dials loopback, in plain HTTP. It never
      # crosses the tailnet.
      ORCHESTRATOR_URL: http://127.0.0.1:${ORCHESTRATOR_PORT}

  # Two listeners on one port. Loopback serves plain HTTP to the dev server's
  # proxy. The dev host serves the change stream, which a page loaded over
  # the tailnet dials directly rather than through the proxy; it speaks TLS
  # under `dev_https:`, with the certificate the `.env` names.
  orchestrator:
    ports: [ORCHESTRATOR]
    command: >-
      uv run mael-orchestrator serve --host 127.0.0.1 --public-host ${DEV_HOST}
      --port ${ORCHESTRATOR_PORT}

  # The agent daemon of this environment. Its root comes from MAEL_AGENT_ROOT
  # in the worktree's `.env`, substituted per worktree from the project root's
  # `.env` template.
  #
  # Starting this service is one of the two ways a daemon comes to exist; the
  # other is the `agent-daemon` host service, the production daemon that the
  # OS supervisor runs. Nothing else starts one. See docs/dev/agent-daemon.md.
  agent-daemon:
    command: uv run mael-agent-daemon serve

  # The component workbench. Optional, because it serves no part of the running
  # app: it draws the web components against fixtures so the panel's visual
  # states can be seen without an orchestrator, a daemon or a live agent.
  # Start it by name: `mael env start ladle`.
  ladle:
    optional: true
    ports: [LADLE_APP]
    dir: orchestrator-ui
    command: pnpm ladle --port ${LADLE_APP_PORT}

  # The fake mode (CONTEXT.md). Optional: `mael env start web-fake`.
  web-fake:
    optional: true
    # FRONTEND in the name makes the port web-facing, so the orchestrator links it.
    ports: [FAKE_FRONTEND, FAKE_FRONTEND_HMR]
    dir: orchestrator-ui
    command: pnpm dev
    env:
      FAKE_MODE: "1"
      FRONTEND_PORT: ${FAKE_FRONTEND_PORT}
      FRONTEND_HMR_PORT: ${FAKE_FRONTEND_HMR_PORT}
