# `_main` is maelstrom's fixed environment — see docs/guide/worktrees.md.
main_port_base: 277

linear:
  team_id: 3201e7ca-cceb-4079-b8ef-51ffbde14db7
  product_label: Maelstrom

services:
  web:
    ports: [FRONTEND, FRONTEND_HMR]
    dir: web
    command: pnpm dev
    env:
      ORCHESTRATOR_URL: http://localhost:${ORCHESTRATOR_PORT}

  orchestrator:
    ports: [ORCHESTRATOR]
    command: uv run mael orchestrator serve --port ${ORCHESTRATOR_PORT}

  # An agent daemon of this environment's own, for testing a change to the
  # agent protocol against agents that run it. Off by default: start it with
  # `mael env start agent-daemon`. See docs/guide/dev-environments.md.
  #
  # The root carries the project name because `${WORKTREE}` alone collides —
  # one worktree name is used across many projects. Everything the daemon
  # owns lives under that one root: its socket, lock, pid file, log and
  # spawn records. So two daemons cannot share the records that make them
  # spawn, and this one cannot start a second `claude` on a session the
  # everyday daemon holds.
  #
  # A service's `env:` block reaches that service alone. To point this
  # environment's orchestrator at this daemon, set MAEL_AGENT_ROOT in the
  # worktree's .env, which every service reads.
  agent-daemon:
    optional: true
    command: uv run mael agent daemon serve --root ${MAEL_AGENT_ROOT}
    env:
      MAEL_AGENT_ROOT: ${HOME}/.maelstrom/daemons/maelstrom-${WORKTREE}
