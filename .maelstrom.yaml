# `_main` is maelstrom's fixed environment — see docs/guide/worktrees.md.
main_port_base: 277

linear:
  team_id: 3201e7ca-cceb-4079-b8ef-51ffbde14db7
  product_label: Maelstrom

services:
  web:
    ports: [FRONTEND, FRONTEND_HMR]
    dir: web
    command: pnpm dev
    env:
      ORCHESTRATOR_URL: http://localhost:${ORCHESTRATOR_PORT}

  # Bound on every interface, as the web service is: the change stream is
  # dialled directly rather than through the dev server's proxy, so a page
  # loaded over the tailnet reaches this port itself. Close that off at the
  # firewall, as `web/vite.config.ts` says of its own bind.
  orchestrator:
    ports: [ORCHESTRATOR]
    command: uv run mael orchestrator serve --host 0.0.0.0 --port ${ORCHESTRATOR_PORT}

  # The agent daemon of this environment. Its root comes from MAEL_AGENT_ROOT
  # in the worktree's `.env`, substituted per worktree from the project root's
  # `.env` template.
  #
  # Starting this service is one of the two ways a daemon comes to exist; the
  # other is `mael self-env start`, which is this same service on `_main`.
  # Nothing else starts one. See docs/dev/agent-daemon.md.
  agent-daemon:
    command: uv run mael agent daemon serve

  # The component workbench. Optional, because it serves no part of the running
  # app: it draws the web components against fixtures so the panel's visual
  # states can be seen without an orchestrator, a daemon or a live agent.
  # Start it by name: `mael env start ladle`.
  ladle:
    optional: true
    ports: [LADLE]
    dir: web
    command: pnpm ladle --port ${LADLE_PORT}
