# `_main` is maelstrom's fixed environment — see docs/guide/worktrees.md.
main_port_base: 277

linear:
  team_id: 3201e7ca-cceb-4079-b8ef-51ffbde14db7
  product_label: Maelstrom

services:
  web:
    ports: [FRONTEND, FRONTEND_HMR]
    dir: web
    command: pnpm dev
    env:
      ORCHESTRATOR_URL: http://localhost:${ORCHESTRATOR_PORT}

  orchestrator:
    ports: [ORCHESTRATOR]
    command: uv run mael orchestrator serve --port ${ORCHESTRATOR_PORT}

  # An agent daemon of this environment's own, for testing a change to the
  # agent protocol against agents that run it. Off by default: start it with
  # `mael env start agent-daemon`. See docs/guide/dev-environments.md.
  #
  # The socket path carries the project name because `${WORKTREE}` alone
  # collides — one worktree name is used across many projects.
  #
  # MAEL_AGENT_SPEC_DIR must differ from the default. Two daemons sharing a
  # spawn-record directory both restore the same records, so this one would
  # start a second `claude` on every session id the everyday daemon holds.
  #
  # A service's `env:` block reaches that service alone. To point this
  # environment's orchestrator at this daemon, set MAEL_AGENT_SOCKET in the
  # worktree's .env, which every service reads.
  agent-daemon:
    optional: true
    command: uv run mael agent daemon serve --socket ${MAEL_AGENT_SOCKET}
    env:
      MAEL_AGENT_SOCKET: ${HOME}/.maelstrom/sockets/maelstrom-${WORKTREE}.sock
      MAEL_AGENT_SPEC_DIR: ${HOME}/.maelstrom/agents-maelstrom-${WORKTREE}
