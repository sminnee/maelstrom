# `_main` is maelstrom's fixed environment — see docs/guide/worktrees.md.
main_port_base: 277

linear:
  team_id: 3201e7ca-cceb-4079-b8ef-51ffbde14db7
  product_label: Maelstrom

services:
  web:
    ports: [FRONTEND, FRONTEND_HMR]
    dir: web
    command: pnpm dev
    env:
      ORCHESTRATOR_URL: http://localhost:${ORCHESTRATOR_PORT}

  orchestrator:
    ports: [ORCHESTRATOR]
    command: uv run mael orchestrator serve --port ${ORCHESTRATOR_PORT}

  # The agent daemon of this environment. Its root comes from MAEL_AGENT_ROOT
  # in the worktree's `.env`, substituted per worktree from the project root's
  # `.env` template.
  #
  # Starting this service is one of the two ways a daemon comes to exist; the
  # other is `mael self-env start`, which is this same service on `_main`.
  # Nothing else starts one. See docs/dev/agent-daemon.md.
  agent-daemon:
    command: uv run mael agent daemon serve
