[project]
name = "mael-agent-daemon"
version = "0.1.2"
description = "Maelstrom's agent daemon: drives agents over a stream-json pipe"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Minnee" }]
dependencies = ["mael-common", "mael-agent", "click>=8.0"]

[project.scripts]
mael-agent-daemon = "mael_daemon.cli:main"

[tool.uv.sources]
mael-common = { workspace = true }
mael-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mael_daemon"]
