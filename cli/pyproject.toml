[project]
name = "sminnee-maelstrom"
version = "0.1.2"
description = "Parallel development environment manager using git worktrees"
# A link to the repository's README. Hatch reads no readme outside the member.
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Minnee" }]
dependencies = [
    "mael-common",
    "mael-agent",
    "mael-domain",
    "click>=8.2",
    "textual>=8.2.8,<9",
    "pydantic>=2.13.5",
]

[project.urls]
Repository = "https://github.com/sminnee/maelstrom"

[project.scripts]
mael = "mael_cli.cli:main"
sminnee-maelstrom = "mael_cli.cli:main"

[tool.uv.sources]
mael-common = { workspace = true }
mael-agent = { workspace = true }
mael-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mael_cli"]
