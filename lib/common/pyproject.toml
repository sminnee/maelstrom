[project]
name = "mael-common"
version = "0.1.2"
description = "Maelstrom's shared utilities: shell, tables, paths and the async click group"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Minnee" }]
dependencies = ["click>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mael_common"]
