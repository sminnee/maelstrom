[project]
name = "mael-domain"
version = "0.1.2"
description = "Maelstrom's domain model: tasks, worktrees, environments and the state database"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Minnee" }]
dependencies = ["mael-common", "mael-agent", "pyyaml>=6.0", "markdown-to-mrkdwn>=0.3"]

[tool.uv.sources]
mael-common = { workspace = true }
mael-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mael_domain"]
