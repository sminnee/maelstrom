[project]
name = "mael-agent"
version = "0.1.2"
description = "Maelstrom's agent wire contract and daemon client"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Minnee" }]
dependencies = ["mael-common"]

[tool.uv.sources]
mael-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mael_agent"]
