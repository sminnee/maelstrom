name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  # A job skipped by a job-level `if:` reports success, so the required contexts
  # stay satisfied. A workflow skipped by a `paths:` filter does not report them
  # at all, which is why this is a job and not a filter. It decides whether the
  # three gates have anything to run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: filter
        run: |
          # Fail open. Only a detection that runs cleanly may skip e2e. A job
          # skipped because `needs` failed does not report success, so a broken
          # detection would leave the same stuck gate this workflow removes.
          code=true
          base_ref="refs/remotes/origin/$GITHUB_BASE_REF"
          if git fetch --no-tags origin "+refs/heads/$GITHUB_BASE_REF:$base_ref" &&
             base=$(git merge-base "$base_ref" HEAD) &&
             changed=$(git diff --name-only "$base" HEAD) &&
             [ -n "$changed" ]; then
            echo "Changed files:"
            echo "$changed"
            if ! echo "$changed" | grep -Eq '^(src/|tests/|bin/|pyproject\.toml$|\.github/workflows/test\.yml$)'; then
              code=false
            fi
          else
            echo "Could not read the changed files."
          fi
          echo "Run the gates: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest --ignore=tests/e2e

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: bin/lint

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v
