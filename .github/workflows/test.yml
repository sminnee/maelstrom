name: Tests

on:
  pull_request:
    branches: [main]

env:
  # tangier v0.2.0. The tag is not on GitHub, so the commit is pinned.
  TANGIER: git+https://github.com/sminnee/tangier@e86d406f6d7948d4313abf670c80f7b6f74d0702

jobs:
  # Decides which gates have anything to run. See docs/dev/ci.md.
  #
  # A job skipped by a job-level `if:` reports success, so the required
  # contexts stay satisfied. A workflow skipped by a `paths:` filter does not
  # report them at all, which is why this is a job and not a filter.
  gates:
    runs-on: ubuntu-latest
    outputs:
      test-run: ${{ steps.gates.outputs.test-run }}
      lint-run: ${{ steps.gates.outputs.lint-run }}
      e2e-run: ${{ steps.gates.outputs.e2e-run }}
      web-run: ${{ steps.gates.outputs.web-run }}
    steps:
      # The gates diff from the merge base. `blob:none` fetches commits and
      # trees only.
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Find the gates to run
        id: gates
        # Fail open. A failed step sets no output, and each job below runs
        # unless its output is exactly `false`.
        continue-on-error: true
        run: uvx --from "$TANGIER" tangier gate github-outputs --base "origin/$GITHUB_BASE_REF"

      # A broken SHA bucket gives `mael self-update` no service versions, and
      # nothing else reports it.
      - name: Hash the SHA buckets
        run: uvx --from "$TANGIER" tangier changemap sha --all

  test:
    needs: gates
    # `!cancelled()`, so a failed `gates` job runs the gate rather than skipping it.
    if: ${{ !cancelled() && needs.gates.outputs.test-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      # The command is `[gate.test]` in pipeline.toml. `--read-only`: CI records nothing.
      - name: Run tests
        run: uvx --from "$TANGIER" tangier gate run test --read-only --base "origin/$GITHUB_BASE_REF"

  lint:
    needs: gates
    if: ${{ !cancelled() && needs.gates.outputs.lint-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run linting
        run: uvx --from "$TANGIER" tangier gate run lint --read-only --base "origin/$GITHUB_BASE_REF"

  e2e:
    needs: gates
    if: ${{ !cancelled() && needs.gates.outputs.e2e-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run e2e tests
        run: uvx --from "$TANGIER" tangier gate run e2e --read-only --base "origin/$GITHUB_BASE_REF"

  # One step for each member of `[gate.web]`. A member whose record exists
  # reports `verified` in seconds.
  web:
    needs: gates
    if: ${{ !cancelled() && needs.gates.outputs.web-run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          package_json_file: orchestrator-ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orchestrator-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir orchestrator-ui install --frozen-lockfile

      - name: Lint
        run: uvx --from "$TANGIER" tangier gate run web.lint --read-only --base "origin/$GITHUB_BASE_REF"

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: uvx --from "$TANGIER" tangier gate run web.typecheck --read-only --base "origin/$GITHUB_BASE_REF"

      - name: Dead code
        if: ${{ !cancelled() }}
        run: uvx --from "$TANGIER" tangier gate run web.knip --read-only --base "origin/$GITHUB_BASE_REF"

      - name: Test
        if: ${{ !cancelled() }}
        run: uvx --from "$TANGIER" tangier gate run web.test --read-only --base "origin/$GITHUB_BASE_REF"

      - name: Build
        if: ${{ !cancelled() }}
        run: uvx --from "$TANGIER" tangier gate run web.build --read-only --base "origin/$GITHUB_BASE_REF"
