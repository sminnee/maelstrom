name: Prune gate records
# `tangier gate run` leaves one record ref for each gate pass, under
# refs/tangier/gates/. Nothing else deletes them. See docs/dev/ci.md.
on:
  schedule:
    - cron: "0 15 1 * *" # monthly, on the 2nd at 03:00 NZST

  # Allow manual triggers
  workflow_dispatch:

permissions:
  # Deleting a ref on origin is a push.
  contents: write

jobs:
  prune:
    name: Prune gate records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Delete records older than 30 days
        # tangier v0.2.0, pinned by commit as in test.yml.
        run: uvx --from git+https://github.com/sminnee/tangier@e86d406f6d7948d4313abf670c80f7b6f74d0702 tangier gate prune --older-than 30
